<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>plot armor</title>
    <style>
      /* Tokens from v0 / app/globals.css (Cyber-Noir) */
      :root {
        color-scheme: dark;
        --background: #09090b;
        --foreground: #fafafa;
        --secondary: #18181b;
        --muted-foreground: #a1a1aa;
        --border: #27272a;
        --input: #27272a;
        --primary: #3b82f6;
        --radius-lg: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 380px;
        background: var(--background);
        color: var(--foreground);
        font-family:
          "Segoe UI Variable Text",
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 14px;
        line-height: 1.45;
        /* Default smoothing keeps ClearType/subpixel sharp on Windows (avoids fuzzy grayscale AA). */
        -webkit-font-smoothing: auto;
        text-rendering: optimizeLegibility;
      }

      .popup-root {
        width: 380px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        background: var(--background);
        overflow: hidden;
      }

      .popup-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
        padding: 16px;
      }

      .popup-header h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.012em;
        color: var(--foreground);
        text-transform: lowercase;
      }

      .header-status {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .ping {
        position: relative;
        display: flex;
        width: 8px;
        height: 8px;
      }

      .ping-ring {
        position: absolute;
        display: inline-flex;
        width: 100%;
        height: 100%;
        border-radius: 9999px;
        background: var(--primary);
        opacity: 0.75;
        animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      .ping-dot {
        position: relative;
        display: inline-flex;
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: var(--primary);
      }

      @keyframes ping {
        75%,
        100% {
          transform: scale(2);
          opacity: 0;
        }
      }

      .header-status-text {
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--muted-foreground);
      }

      .header-status.is-standby .ping-ring {
        display: none;
      }

      .header-status.is-standby .ping-dot {
        background: var(--muted-foreground);
        opacity: 0.45;
      }

      .header-status.is-standby .header-status-text {
        color: #8d8d96;
      }

      .popup-input {
        border-bottom: 1px solid var(--border);
        padding: 16px;
      }

      .input-row-v0 {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .input-wrap-v0 {
        position: relative;
        flex: 1;
        min-width: 0;
      }

      .input-gt {
        position: absolute;
        left: 12px;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 14px;
        font-weight: 700;
        color: var(--primary);
        pointer-events: none;
        line-height: 1;
      }

      #showInput {
        height: 36px;
        width: 100%;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--secondary);
        padding: 0 12px 0 32px;
        font-size: 14px;
        font-weight: 450;
        color: var(--foreground);
        outline: none;
      }

      #showInput::placeholder {
        color: var(--muted-foreground);
      }

      #showInput:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 1px var(--primary);
      }

      .btn-add {
        flex-shrink: 0;
        height: 36px;
        padding: 0 12px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--secondary);
        color: var(--foreground);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .btn-add:hover {
        background: rgba(24, 24, 27, 0.8);
      }

      .btn-add:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .btn-add:disabled:hover {
        background: var(--secondary);
      }

      .suggestions {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        margin: 0;
        padding: 0;
        list-style: none;
        max-height: 220px;
        overflow-y: auto;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--background);
        z-index: 20;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.45);
      }

      .suggestions.hidden {
        display: none;
      }

      .suggestion-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        cursor: pointer;
        border-bottom: 1px solid rgba(39, 39, 42, 0.6);
      }

      .suggestion-item:last-child {
        border-bottom: 0;
      }

      .suggestion-item:hover {
        background: var(--secondary);
      }

      .suggestion-thumb-wrap {
        width: 32px;
        height: 48px;
        flex-shrink: 0;
        border-radius: 4px;
        overflow: hidden;
        background: var(--secondary);
      }

      .suggestion-thumb-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .suggestion-thumb-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: var(--muted-foreground);
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      }

      .suggestion-text {
        min-width: 0;
        flex: 1;
      }

      .suggestion-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--foreground);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .suggestion-meta {
        margin-top: 2px;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--muted-foreground);
        text-transform: uppercase;
      }

      .popup-metrics {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
      }

      #metricsText {
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 12px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        color: var(--muted-foreground);
      }

      .metrics-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .link-cmd {
        border: 0;
        background: none;
        padding: 0;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.03em;
        text-transform: lowercase;
        color: var(--muted-foreground);
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .link-cmd:hover {
        color: var(--primary);
      }

      .link-cmd:disabled {
        opacity: 0.4;
        cursor: default;
        pointer-events: none;
      }

      .scroll-area {
        height: 280px;
        overflow-y: auto;
        padding: 8px;
      }

      /* Slim scrollbars aligned with popup chrome (Firefox + Chromium) */
      .scroll-area,
      .suggestions {
        scrollbar-width: thin;
        scrollbar-color: rgba(161, 161, 170, 0.55) transparent;
      }

      .scroll-area::-webkit-scrollbar,
      .suggestions::-webkit-scrollbar {
        width: 6px;
      }

      .scroll-area::-webkit-scrollbar-track,
      .suggestions::-webkit-scrollbar-track {
        background: transparent;
        margin: 4px 0;
      }

      .scroll-area::-webkit-scrollbar-thumb,
      .suggestions::-webkit-scrollbar-thumb {
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: padding-box;
        background-color: rgba(113, 113, 122, 0.45);
      }

      .scroll-area::-webkit-scrollbar-thumb:hover,
      .suggestions::-webkit-scrollbar-thumb:hover {
        background-color: rgba(161, 161, 170, 0.65);
      }

      .scroll-area::-webkit-scrollbar-thumb:active,
      .suggestions::-webkit-scrollbar-thumb:active {
        background-color: rgba(96, 165, 250, 0.55);
      }

      .scroll-area::-webkit-scrollbar-corner,
      .suggestions::-webkit-scrollbar-corner {
        background: transparent;
      }

      #emptyState {
        margin: 0;
        padding: 24px 8px;
        text-align: center;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted-foreground);
      }

      #emptyState.hidden {
        display: none;
      }

      #showList {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .show-row {
        display: flex;
        align-items: center;
        gap: 12px;
        border-radius: 6px;
        padding: 8px;
        transition: background 0.15s ease;
      }

      .show-row:hover {
        background: var(--secondary);
      }

      .show-row.show-paused {
        opacity: 0.55;
      }

      .show-row:focus-within .remove-btn {
        opacity: 1;
      }

      .show-row.is-loading {
        pointer-events: none;
        background: rgba(59, 130, 246, 0.12);
        box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.35);
        animation: row-loading-pulse 1.4s ease-in-out infinite;
      }

      @keyframes row-loading-pulse {
        0%,
        100% {
          background: rgba(59, 130, 246, 0.1);
        }
        50% {
          background: rgba(59, 130, 246, 0.18);
        }
      }

      .show-row.is-error {
        outline: 1px solid rgba(239, 68, 68, 0.45);
      }

      .poster {
        position: relative;
        width: 32px;
        height: 48px;
        flex-shrink: 0;
        overflow: hidden;
        border-radius: 4px;
        background: var(--secondary);
      }

      .poster img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .poster-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: var(--muted-foreground);
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      }

      .show-info {
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;
        gap: 2px;
      }

      .show-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 14px;
        font-weight: 600;
        color: var(--foreground);
      }

      .show-ref {
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: var(--muted-foreground);
      }

      .show-sync-status:empty {
        display: none;
      }

      .show-sync-status {
        font-size: 12px;
        font-weight: 600;
        color: var(--primary);
        line-height: 1.35;
      }

      .poster-loading-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(9, 9, 11, 0.62);
        border-radius: 4px;
      }

      .poster-loading-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(250, 250, 250, 0.2);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: pa-spin 0.65s linear infinite;
      }

      @keyframes pa-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .show-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }

      .pa-switch {
        position: relative;
        display: inline-flex;
        cursor: pointer;
      }

      .pa-switch-input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }

      .pa-switch-ui {
        display: inline-flex;
        width: 32px;
        height: 1.15rem;
        align-items: center;
        border-radius: 9999px;
        border: 1px solid transparent;
        background: var(--input);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        transition: background 0.15s ease;
      }

      .pa-switch-input:checked + .pa-switch-ui {
        background: var(--primary);
      }

      .pa-switch-ui::after {
        content: "";
        display: block;
        width: 16px;
        height: 16px;
        margin: 2px;
        border-radius: 9999px;
        background: var(--foreground);
        transition: transform 0.15s ease;
      }

      .pa-switch-input:checked + .pa-switch-ui::after {
        transform: translateX(14px);
      }

      .pa-switch-input:focus-visible + .pa-switch-ui {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .pa-switch-input:disabled + .pa-switch-ui {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .pa-switch:has(.pa-switch-input:disabled) {
        cursor: not-allowed;
      }

      .remove-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted-foreground);
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
      }

      .show-row:hover .remove-btn {
        opacity: 1;
      }

      .remove-btn:hover {
        background: var(--secondary);
        color: var(--foreground);
      }

      .remove-btn:disabled {
        opacity: 0;
        pointer-events: none;
      }

      .remove-btn svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="popup-root">
      <header class="popup-header">
        <h1>plot armor</h1>
        <div class="header-status is-standby" id="headerShieldStatus">
          <span class="ping" aria-hidden="true">
            <span class="ping-ring"></span>
            <span class="ping-dot"></span>
          </span>
          <span class="header-status-text" id="headerShieldLabel">Standby</span>
        </div>
      </header>

      <section class="popup-input">
        <div class="input-row-v0">
          <div class="input-wrap-v0">
            <span class="input-gt" aria-hidden="true">&gt;</span>
            <input
              id="showInput"
              type="text"
              placeholder="Search TMDB, then pick a result…"
              autocomplete="off"
            />
            <ul id="suggestions" class="suggestions hidden"></ul>
          </div>
          <button id="addBtn" type="button" class="btn-add" disabled aria-disabled="true">Add</button>
        </div>
      </section>

      <section class="popup-metrics">
        <span id="metricsText">0/0 Shields Active</span>
        <div class="metrics-actions">
          <button type="button" id="pauseAllBtn" class="link-cmd">pause all</button>
          <button type="button" id="enableAllBtn" class="link-cmd">enable all</button>
        </div>
      </section>

      <div class="scroll-area">
        <p id="emptyState">No protected shows yet.</p>
        <ul id="showList"></ul>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
