<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>plot armor</title>
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --background: #100c0a;
        --foreground: #f3e7d6;
        --secondary: #1c1714;
        --muted-foreground: #9a8775;
        --border: #2c231d;
        --input: #2c231d;
        --primary: #ff9e3d;
        --accent: #ff5e7e;
        --radius: 8px;
        --font-sans: "Satoshi", system-ui, -apple-system, sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 380px;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.45;
        -webkit-font-smoothing: auto;
        text-rendering: optimizeLegibility;
      }

      .popup-root {
        position: relative;
        width: 380px;
        overflow: hidden;
        background: var(--background);
      }

      .popup-root::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 50;
        background: repeating-linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0) 0px,
          rgba(0, 0, 0, 0) 2px,
          rgba(0, 0, 0, 0.18) 3px,
          rgba(0, 0, 0, 0.18) 3px
        );
        mix-blend-mode: multiply;
      }

      .crt-glow {
        pointer-events: none;
        position: absolute;
        inset: 0;
        background:
          radial-gradient(120% 80% at 50% 0%, rgba(255, 158, 61, 0.1), transparent 60%),
          radial-gradient(120% 90% at 50% 110%, rgba(255, 94, 126, 0.1), transparent 55%);
      }

      .popup-inner {
        position: relative;
        z-index: 10;
      }

      .popup-header {
        display: flex;
        align-items: center;
        padding: 20px 20px 0;
      }

      .header-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .header-logo {
        width: 26px;
        height: 26px;
        display: block;
        flex-shrink: 0;
        mix-blend-mode: screen;
        opacity: 0.88;
      }

      .popup-header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--foreground);
        text-transform: lowercase;
      }

      .accent-stripe {
        display: flex;
        gap: 2px;
        height: 4px;
        margin: 14px 20px 0;
        border-radius: 999px;
        overflow: hidden;
        opacity: 0.8;
      }

      .accent-stripe span {
        flex: 1;
      }

      .accent-stripe span:nth-child(1) {
        background: #ffc857;
      }

      .accent-stripe span:nth-child(2) {
        background: #ff9e3d;
      }

      .accent-stripe span:nth-child(3) {
        background: #ff7a4d;
      }

      .accent-stripe span:nth-child(4) {
        background: #ff5e7e;
      }

      .accent-stripe span:nth-child(5) {
        background: #d94f6c;
      }

      .popup-input {
        padding: 14px 20px 16px;
      }

      .input-row-v0 {
        display: flex;
        align-items: stretch;
        gap: 8px;
      }

      .input-wrap-v0 {
        position: relative;
        flex: 1;
        min-width: 0;
      }

      .input-gt {
        position: absolute;
        left: 11px;
        top: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        font-family: var(--font-sans);
        font-size: 14px;
        font-weight: 600;
        color: var(--primary);
        pointer-events: none;
        line-height: 1;
      }

      #showInput {
        height: 40px;
        width: 100%;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--secondary) 60%, transparent);
        padding: 0 12px 0 26px;
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 500;
        color: var(--foreground);
        outline: none;
      }

      #showInput::placeholder {
        color: var(--muted-foreground);
        opacity: 0.85;
      }

      #showInput:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 1px color-mix(in srgb, var(--primary) 40%, transparent);
      }

      .btn-add {
        flex-shrink: 0;
        height: 40px;
        padding: 0 16px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--secondary) 60%, transparent);
        color: var(--foreground);
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }

      .btn-add:hover:not(:disabled) {
        border-color: color-mix(in srgb, var(--primary) 50%, transparent);
        background: color-mix(in srgb, var(--primary) 10%, transparent);
        color: var(--primary);
      }

      .btn-add:disabled {
        opacity: 1;
        color: var(--muted-foreground);
        border-color: color-mix(in srgb, var(--border) 80%, transparent);
        background: color-mix(in srgb, var(--secondary) 40%, transparent);
        cursor: not-allowed;
      }

      .btn-add:disabled:hover {
        color: var(--muted-foreground);
        border-color: color-mix(in srgb, var(--border) 80%, transparent);
        background: color-mix(in srgb, var(--secondary) 40%, transparent);
      }

      .suggestions {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        right: 0;
        margin: 0;
        padding: 0;
        list-style: none;
        max-height: 220px;
        overflow-y: auto;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--background);
        z-index: 20;
      }

      .suggestions.hidden {
        display: none;
      }

      .suggestion-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        cursor: pointer;
        border-bottom: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
      }

      .suggestion-item:last-child {
        border-bottom: 0;
      }

      .suggestion-item:hover {
        background: var(--secondary);
      }

      .suggestion-thumb-wrap {
        width: 32px;
        height: 48px;
        flex-shrink: 0;
        border-radius: 4px;
        overflow: hidden;
        background: var(--secondary);
        border: 1px solid var(--border);
      }

      .suggestion-thumb-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .suggestion-thumb-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: var(--muted-foreground);
        font-family: var(--font-sans);
      }

      .suggestion-text {
        min-width: 0;
        flex: 1;
      }

      .suggestion-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--foreground);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .suggestion-meta {
        margin-top: 2px;
        font-family: var(--font-sans);
        font-size: 11px;
        font-weight: 500;
        color: var(--muted-foreground);
      }

      .popup-metrics {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        padding: 10px 20px;
      }

      #metricsText {
        font-family: var(--font-sans);
        font-size: 12px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        color: var(--muted-foreground);
      }

      .metrics-actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .link-cmd {
        border: 0;
        background: none;
        padding: 0;
        font-family: var(--font-sans);
        font-size: 12px;
        font-weight: 500;
        text-transform: lowercase;
        color: var(--muted-foreground);
        cursor: pointer;
        text-decoration: underline;
        text-decoration-color: color-mix(in srgb, var(--muted-foreground) 40%, transparent);
        text-underline-offset: 4px;
      }

      .link-cmd:hover {
        color: var(--accent);
        text-decoration-color: var(--accent);
      }

      #enableAllBtn:hover:not(:disabled) {
        color: var(--primary);
        text-decoration-color: var(--primary);
      }

      .link-cmd:disabled {
        opacity: 0.4;
        cursor: default;
        pointer-events: none;
      }

      .scroll-area {
        height: 280px;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 8px 12px;
      }

      .scroll-area,
      .suggestions {
        scrollbar-width: thin;
        scrollbar-color: rgba(154, 135, 117, 0.55) transparent;
      }

      .scroll-area::-webkit-scrollbar,
      .suggestions::-webkit-scrollbar {
        width: 6px;
      }

      .scroll-area::-webkit-scrollbar-track,
      .suggestions::-webkit-scrollbar-track {
        background: transparent;
        margin: 4px 0;
      }

      .scroll-area::-webkit-scrollbar-thumb,
      .suggestions::-webkit-scrollbar-thumb {
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: padding-box;
        background-color: rgba(154, 135, 117, 0.4);
      }

      .scroll-area::-webkit-scrollbar-thumb:hover,
      .suggestions::-webkit-scrollbar-thumb:hover {
        background-color: rgba(154, 135, 117, 0.6);
      }

      #emptyState {
        margin: 0;
        padding: 24px 8px;
        text-align: center;
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 500;
        color: var(--muted-foreground);
      }

      #emptyState.hidden {
        display: none;
      }

      #showList {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .media-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-width: 0;
        padding: 10px;
        border-radius: var(--radius);
        border: 1px solid transparent;
        background-color: transparent;
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }

      .media-row:hover {
        border-color: var(--border);
        background-color: color-mix(in srgb, var(--secondary) 50%, transparent);
      }

      .media-row.show-paused .poster {
        opacity: 0.3;
        filter: grayscale(1);
      }

      .media-row.show-paused .title {
        color: var(--muted-foreground);
      }

      .media-row:not(.show-paused) .poster-wrap {
        box-shadow: 0 0 8px rgba(255, 158, 61, 0.25);
      }

      .media-row.show-paused .poster-wrap {
        box-shadow: none;
      }

      .media-row:focus-within .delete-btn {
        opacity: 1;
      }

      .media-row.is-loading {
        pointer-events: none;
        border-color: color-mix(in srgb, var(--primary) 35%, transparent);
        background: color-mix(in srgb, var(--primary) 8%, transparent);
      }

      .media-row.is-error {
        border-color: color-mix(in srgb, var(--accent) 55%, transparent);
      }

      .poster-wrap {
        position: relative;
        flex-shrink: 0;
        width: 32px;
        height: 48px;
        border-radius: 4px;
        overflow: hidden;
        border: 1px solid var(--border);
      }

      .poster {
        display: block;
        width: 32px;
        height: 48px;
        object-fit: cover;
        background: var(--secondary);
        flex-shrink: 0;
      }

      .poster.poster--empty {
        object-fit: none;
        background: var(--secondary);
      }

      .meta-content {
        display: flex;
        flex: 1;
        min-width: 0;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
      }

      .title {
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.25;
        color: var(--foreground);
      }

      .ref-code {
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted-foreground);
      }

      .show-sync-status:empty {
        display: none;
      }

      .show-sync-status {
        font-family: var(--font-sans);
        font-size: 11px;
        font-weight: 500;
        color: var(--primary);
        line-height: 1.35;
      }

      .poster-loading-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: color-mix(in srgb, var(--background) 72%, transparent);
        border-radius: 4px;
      }

      .poster-loading-spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(250, 250, 250, 0.2);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: pa-spin 0.65s linear infinite;
      }

      @keyframes pa-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
        margin-left: auto;
      }

      .toggle-btn,
      .delete-btn {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .toggle-btn {
        position: relative;
        width: 32px;
        height: 32px;
      }

      .pa-clapper-input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }

      .pa-clapper-ui {
        display: flex;
        width: 28px;
        height: 28px;
        color: var(--muted-foreground);
        transition: color 0.18s ease;
      }

      .pa-clapper-ui svg {
        display: block;
        width: 28px;
        height: 28px;
        overflow: visible;
      }

      .clapper-arm,
      .pa-clapper-arm {
        transform-box: view-box;
        transform-origin: 4px 12.5px;
        transition: transform 260ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .pa-clapper-body-fill {
        fill-opacity: 0.08;
        transition: fill-opacity 0.18s ease;
      }

      .pa-clapper-input:checked + .pa-clapper-ui {
        color: var(--primary);
      }

      .pa-clapper-input:checked + .pa-clapper-ui .pa-clapper-body-fill {
        fill-opacity: 0.2;
      }

      .pa-clapper-input:not(:checked) + .pa-clapper-ui .clapper-arm,
      .pa-clapper-input:not(:checked) + .pa-clapper-ui .pa-clapper-arm {
        transform: rotate(0deg);
      }

      .pa-clapper-input:checked + .pa-clapper-ui .clapper-arm,
      .pa-clapper-input:checked + .pa-clapper-ui .pa-clapper-arm {
        transform: rotate(-30deg);
      }

      .toggle-btn:has(.pa-clapper-input:focus-visible) {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .toggle-btn:has(.pa-clapper-input:disabled) {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .delete-btn {
        width: 22px;
        height: 22px;
        border-radius: 4px;
        color: var(--muted-foreground);
        opacity: 0;
        transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
      }

      .media-row:hover .delete-btn {
        opacity: 1;
      }

      .delete-btn:hover {
        background: var(--secondary);
        color: var(--foreground);
      }

      .delete-btn:disabled {
        opacity: 0;
        pointer-events: none;
      }

      .delete-btn svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="popup-root">
      <div class="crt-glow" aria-hidden="true"></div>
      <div class="popup-inner">
        <header class="popup-header">
          <div class="header-brand">
            <img class="header-logo" src="icons/logo-pa.png" alt="" width="26" height="26" />
            <h1>plot armor</h1>
          </div>
        </header>

        <div class="accent-stripe" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <section class="popup-input">
          <div class="input-row-v0">
            <div class="input-wrap-v0">
              <span class="input-gt" aria-hidden="true">&gt;</span>
              <input
                id="showInput"
                type="text"
                placeholder="Search TMDB…"
                autocomplete="off"
              />
              <ul id="suggestions" class="suggestions hidden"></ul>
            </div>
            <button id="addBtn" type="button" class="btn-add" disabled aria-disabled="true">Add</button>
          </div>
        </section>

        <section class="popup-metrics">
          <span id="metricsText">0/0 Shields Active</span>
          <div class="metrics-actions">
            <button type="button" id="pauseAllBtn" class="link-cmd">pause all</button>
            <button type="button" id="enableAllBtn" class="link-cmd">enable all</button>
          </div>
        </section>

        <div class="scroll-area">
          <p id="emptyState">No protected shows yet.</p>
          <ul id="showList"></ul>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
