<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>plot armor — settings</title>
  <link
    href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      color-scheme: dark;
      --background: #100c0a;
      --foreground: #f3e7d6;
      --secondary: #1c1714;
      --muted-foreground: #9a8775;
      --border: #2c231d;
      --input: #2c231d;
      --primary: #ff9e3d;
      --accent: #ff5e7e;
      --radius: 8px;
      --font-sans: "Satoshi", system-ui, -apple-system, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--foreground);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: auto;
      text-rendering: optimizeLegibility;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .page-root {
      position: relative;
      max-width: 520px;
      width: 100%;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--background);
      overflow: hidden;
    }

    .page-root::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.18) 3px,
        rgba(0, 0, 0, 0.18) 3px
      );
      mix-blend-mode: multiply;
    }

    .crt-glow {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(255, 158, 61, 0.1), transparent 60%),
        radial-gradient(120% 90% at 50% 110%, rgba(255, 94, 126, 0.1), transparent 55%);
    }

    .page-inner {
      position: relative;
      z-index: 10;
    }

    .header {
      padding: 24px 24px 0;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .header-logo {
      width: 26px;
      height: 26px;
      display: block;
      flex-shrink: 0;
      mix-blend-mode: screen;
      opacity: 0.88;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--foreground);
      text-transform: lowercase;
    }

    .subtitle {
      margin: 0;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      color: var(--muted-foreground);
    }

    .accent-stripe {
      display: flex;
      gap: 2px;
      height: 4px;
      margin: 16px 24px 0;
      border-radius: 999px;
      overflow: hidden;
      opacity: 0.8;
    }

    .accent-stripe span {
      flex: 1;
    }

    .accent-stripe span:nth-child(1) { background: #ffc857; }
    .accent-stripe span:nth-child(2) { background: #ff9e3d; }
    .accent-stripe span:nth-child(3) { background: #ff7a4d; }
    .accent-stripe span:nth-child(4) { background: #ff5e7e; }
    .accent-stripe span:nth-child(5) { background: #d94f6c; }

    .content {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group:last-of-type {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--foreground);
      margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      height: 40px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--secondary) 60%, transparent);
      padding: 0 12px;
      font-size: 13px;
      font-family: var(--font-sans);
      font-weight: 500;
      color: var(--foreground);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="password"]::placeholder {
      color: var(--muted-foreground);
      opacity: 0.7;
    }

    input[type="password"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--primary) 40%, transparent);
    }

    .hint {
      margin-top: 6px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      color: var(--muted-foreground);
      line-height: 1.5;
    }

    .hint a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .hint a:hover {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 28px;
    }

    button {
      flex: 1;
      height: 40px;
      padding: 0 16px;
      border-radius: var(--radius);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        color 0.15s ease;
    }

    .btn-save {
      border: 1px solid var(--primary);
      background: var(--primary);
      color: #1a120c;
    }

    .btn-save:hover {
      background: #ffb35c;
      border-color: #ffb35c;
    }

    .btn-clear {
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--secondary) 60%, transparent);
      color: var(--foreground);
    }

    .btn-clear:hover {
      border-color: color-mix(in srgb, var(--accent) 50%, transparent);
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      color: var(--accent);
    }

    .status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: var(--radius);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      display: none;
      border: 1px solid transparent;
    }

    .status.success {
      background: color-mix(in srgb, var(--primary) 12%, transparent);
      border-color: color-mix(in srgb, var(--primary) 35%, transparent);
      color: var(--primary);
    }

    .status.error {
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border-color: color-mix(in srgb, var(--accent) 35%, transparent);
      color: var(--accent);
    }

    .status.show {
      display: block;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .footer {
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      text-align: center;
    }

    .footer-text {
      margin: 0;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      color: var(--muted-foreground);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="page-root">
    <div class="crt-glow" aria-hidden="true"></div>
    <div class="page-inner">
      <div class="header">
        <div class="header-brand">
          <img class="header-logo" src="icons/logo-pa.png" alt="" width="26" height="26" />
          <h1>plot armor settings</h1>
        </div>
        <p class="subtitle">Configure API keys for spoiler detection</p>
      </div>

      <div class="accent-stripe" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="content">
        <form id="optionsForm">
          <div class="form-group">
            <label for="openaiKey">OpenAI API Key</label>
            <input
              type="password"
              id="openaiKey"
              placeholder="sk-proj-..."
              autocomplete="off"
            />
            <p class="hint">
              Required for semantic spoiler detection.
              <a href="https://platform.openai.com/api-keys" target="_blank">get key →</a>
            </p>
          </div>

          <div class="form-group">
            <label for="tmdbToken">TMDB Read Access Token</label>
            <input
              type="password"
              id="tmdbToken"
              placeholder="eyJhbGciOiJIUzI1NiJ9..."
              autocomplete="off"
            />
            <p class="hint">
              Required for searching and adding shows.
              <a href="https://www.themoviedb.org/settings/api" target="_blank">get token →</a>
            </p>
          </div>

          <div class="button-group">
            <button type="submit" class="btn-save">Save Settings</button>
            <button type="button" id="clearBtn" class="btn-clear">Clear Keys</button>
          </div>

          <div id="status" class="status"></div>
        </form>
      </div>

      <div class="footer">
        <p class="footer-text">
          Keys are stored locally in your browser and never sent to any server except OpenAI and TMDB.
        </p>
      </div>
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
